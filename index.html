<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>АРТЕМ ГУМЕНЯК LEGO — 3D Конструктор</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- ГОЛОВНЕ МЕНЮ -->
  <div id="main-menu" class="menu-overlay">
    <div class="menu-card">
      <div class="lego-logo">
        <span class="logo-top">ДЕНИС ГАНДЗЮК</span>
        <span class="logo-bottom">LEGO</span>
      </div>
      <p class="menu-subtitle">3D-конструктор • 100 Машин • 100 Будинків • 132 Фігурки • Пластина 64×64</p>

      <div class="menu-section">
        <label class="menu-label">Розмір робочої пластини:</label>
        <div class="plate-size-selector">
          <button class="size-btn" data-size="16">16 × 16</button>
          <button class="size-btn" data-size="24">24 × 24</button>
          <button class="size-btn active" data-size="32">32 × 32</button>
          <button class="size-btn mega-size" data-size="64">64 × 64 🔥</button>
        </div>
      </div>

      <div class="menu-buttons">
        <button id="btn-start-sandbox" class="lego-btn btn-green">
          🧱 ПОЧАТИ БУДІВНИЦТВО (ВІЛЬНИЙ РЕЖИМ)
        </button>
        <button id="btn-start-city" class="lego-btn btn-yellow">
          🌆 СТАРТОВЕ МЕГА-МІСТО 64×64
        </button>
        <button id="btn-open-ldraw" class="lego-btn btn-blue">
          🌐 ІМПОРТ З ВІДКРИТОЇ БАЗИ LDRAW (.LDR / .MPD)
        </button>
      </div>

      <!-- ПІДМЕНЮ LDRAW -->
      <div id="ldraw-panel" class="sub-panel hidden">
        <h3>Відкрита бібліотека моделей LDraw:</h3>
        <div class="blueprint-grid">
          <button class="ldraw-remote-btn" data-url="https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/ldraw/officialLibrary/models/car.ldr_Packed.mpd">
            🚗 Класичне Авто
          </button>
          <button class="ldraw-remote-btn" data-url="https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/ldraw/officialLibrary/models/889-1-RadarTruck.mpd_Packed.mpd">
            📡 Радарна Вантажівка
          </button>
          <button class="ldraw-remote-btn" data-url="https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/models/ldraw/officialLibrary/models/1621-1-LunarMPVVehicle.mpd_Packed.mpd">
            🌕 Місячний Всюдихід
          </button>
          <label class="file-upload-btn">
            📂 Свій .LDR / .MPD
            <input type="file" id="ldraw-file-input" accept=".ldr,.mpd,.dat" hidden />
          </label>
        </div>
      </div>

      <div class="controls-hint">
        <span><b>🧱 Будувати</b> — ставити блоки</span>
        <span><b>✋ Рухати</b> — тягнути машини, будинки й деталі</span>
        <span><b>360°</b> — тягни вільне місце</span>
      </div>
    </div>
  </div>

  <!-- ІГРОВИЙ ІНТЕРФЕЙС (HUD) -->
  <div id="hud" class="hidden">
    <!-- КОМПАКТНА ВЕРХНЯ ПАНЕЛЬ -->
    <header class="top-bar">
      <div class="top-left">
        <button id="btn-back-menu" class="hud-chip chip-red" title="Головне меню">☰</button>
        <span class="brand-text">ДЕНИС ГАНДЗЮК <b>LEGO</b></span>
        <span class="counter-chip">🧱 <b id="brick-counter">0</b></span>
      </div>

      <div class="top-right">
        <button id="toggle-colors-btn" class="hud-chip active-indicator" title="Палітра кольорів">
          <span class="current-color-dot" id="current-color-dot"></span>
          <span class="hide-xs">Колір</span>
        </button>
        <button id="toggle-camera-btn" class="hud-chip" title="Огляд 360° з усіх сторін">
          🎥 <span class="hide-xs">Огляд</span>
        </button>
        <button id="toggle-studio-btn" class="hud-chip" title="Інструменти студії">
          ⚙️ <span class="hide-xs">Студія</span>
        </button>
      </div>
    </header>

    <!-- СПЛИВАЮЧЕ ВІКНО 1: ПАЛІТРА КОЛЬОРІВ -->
    <div id="popover-colors" class="floating-popover popover-colors hidden">
      <div class="popover-header">
        <span>🎨 Колір деталі</span>
        <button class="close-pop-btn" data-close="popover-colors">✕</button>
      </div>
      <div class="color-grid" id="color-palette"></div>
    </div>

    <!-- СПЛИВАЮЧЕ ВІКНО 2: КАМЕРА 360° -->
    <div id="popover-camera" class="floating-popover popover-camera hidden">
      <div class="popover-header">
        <span>🎥 Огляд 360°</span>
        <button class="close-pop-btn" data-close="popover-camera">✕</button>
      </div>
      <div class="cam-grid">
        <button class="cam-btn" data-view="front">Спереду</button>
        <button class="cam-btn" data-view="back">Ззаду</button>
        <button class="cam-btn" data-view="left">Зліва</button>
        <button class="cam-btn" data-view="right">Справа</button>
        <button class="cam-btn" data-view="top">Зверху</button>
        <button class="cam-btn" data-view="iso">3D Вид</button>
      </div>
      <button id="btn-auto-orbit" class="full-pop-btn">🔄 Авто-обліт 360°</button>
    </div>

    <!-- СПЛИВАЮЧЕ ВІКНО 3: СТУДІЯ ТА ЗБЕРЕЖЕННЯ -->
    <div id="popover-studio" class="floating-popover popover-studio hidden">
      <div class="popover-header">
        <span>⚙️ Студія та Файли</span>
        <button class="close-pop-btn" data-close="popover-studio">✕</button>
      </div>
      <div class="studio-grid">
        <button id="btn-lighting" class="studio-btn">☀️ Освітлення: День</button>
        <button id="btn-explode" class="studio-btn">💥 Вибух-схема</button>
        <button id="btn-photo" class="studio-btn">📸 Фото моделі (PNG)</button>
        <button id="btn-save" class="studio-btn">💾 Зберегти (JSON)</button>
        <label class="studio-btn">
          📂 Відкрити (JSON)
          <input type="file" id="json-load-input" accept=".json" hidden />
        </label>
        <button id="btn-clear" class="studio-btn danger">🗑️ Очистити поле</button>
      </div>
    </div>

    <!-- ПАНЕЛЬ РЕЖИМІВ ТА ВІЛЬНОГО ПЕРЕСУВАННЯ -->
    <div class="mode-dock" id="mode-dock">
      <div class="mode-pills">
        <button id="tool-build" class="mode-btn active">🧱 Будувати</button>
        <button id="tool-move" class="mode-btn">✋ Рухати</button>
        <button id="tool-paint" class="mode-btn">🎨 Фарба</button>
        <button id="tool-delete" class="mode-btn">🔨 Видалити</button>
        <button id="btn-rotate" class="mode-btn" title="Поворот 90° (R)">🔄 90°</button>
        <button id="btn-undo" class="mode-btn" title="Скасувати (Ctrl+Z)">↩️</button>
      </div>

      <!-- ПІДПАНЕЛЬ ПЕРЕМІЩЕННЯ ОБ'ЄКТА / ДЕТАЛІ -->
      <div id="move-subbar" class="move-subbar hidden">
        <button id="btn-move-scope" class="scope-btn" title="Перемикач: рухати весь об'єкт чи одну деталь">
          🏠 Весь об'єкт
        </button>
        <div class="nudge-pad">
          <button class="nudge-btn" data-dx="0" data-dz="-1" title="Вперед">⬆️</button>
          <button class="nudge-btn" data-dx="0" data-dz="1" title="Назад">⬇️</button>
          <button class="nudge-btn" data-dx="-1" data-dz="0" title="Вліво">⬅️</button>
          <button class="nudge-btn" data-dx="1" data-dz="0" title="Вправо">➡️</button>
        </div>
        <button id="btn-clone-selected" class="scope-btn clone-btn" title="Створити копію вибраного">📋 Копія</button>
        <button id="btn-deselect" class="scope-btn done-btn" title="Зафіксувати">✅</button>
      </div>
    </div>

    <!-- НИЖНІЙ ІНТЕРАКТИВНИЙ БАНЕР: БЛОКИ, 100 МАШИН, 100 БУДИНКІВ, 132 ФІГУРКИ, НАБОРИ -->
    <section class="parts-banner" id="parts-banner">
      <div class="banner-top-row">
        <div class="category-tabs" id="category-tabs">
          <button class="cat-tab active" data-cat="bricks">🧱 Блоки</button>
          <button class="cat-tab" data-cat="cars">🏎️ Машини (100)</button>
          <button class="cat-tab" data-cat="houses">🏠 Будинки (100)</button>
          <button class="cat-tab" data-cat="sets">🚁 Ще набори (32)</button>
          <button class="cat-tab" data-cat="minifigs">🧍 Фігурки (132)</button>
        </div>

        <button id="btn-collapse-banner" class="collapse-btn" title="Згорнути / Розгорнути панель">🔽</button>
      </div>

      <!-- ПІДФІЛЬТРИ ДЛЯ АКТИВНОЇ КАТЕГОРІЇ -->
      <div class="subfilter-bar" id="subfilter-bar"></div>

      <!-- ПОШУК ТА КНОПКА СПАВНУ -->
      <div class="banner-search-row">
        <input type="text" id="part-search" placeholder="🔍 Пошук за назвою або номером..." />
        <button id="btn-spawn-center" class="spawn-now-btn">⚡ СПАВН НА ПОЛЕ</button>
      </div>

      <!-- СТРІЧКА КАРТОК -->
      <div class="banner-items" id="banner-items"></div>
    </section>

    <!-- СПЛИВАЮЧЕ ПОВІДОМЛЕННЯ -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <!-- 3D СЦЕНА -->
  <canvas id="game-canvas"></canvas>

  <script type="module" src="game.js"></script>
</body>
</html>
